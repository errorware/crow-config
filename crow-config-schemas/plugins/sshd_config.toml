[plugin]
name = "sshd_config"
grammar = "sshd-line-grammar"

[shape]
kind = "key_value_list"
order_sensitive = false
order_note = "For each keyword, OpenSSH uses the first obtained value. Later duplicate definitions are ignored."

[[fields]]
name = "Port"
type = "port"
required = false
help = "Port on which the SSH daemon listens (default 22)."

[[fields]]
name = "PermitRootLogin"
type = "enum"
required = false
docs_source = "man:sshd_config(5)#PermitRootLogin"
help = "Specifies whether root can log in using ssh."
options = [
  { value = "prohibit-password", label = "Login allowed only with public key authentication", risk = "recommended" },
  { value = "no", label = "Root login disabled completely", risk = "recommended" },
  { value = "forced-commands-only", label = "Root login allowed only running forced commands", risk = "caution" },
  { value = "yes", label = "Root login enabled with password or keys", risk = "never_on_prod" },
]

[[fields]]
name = "PasswordAuthentication"
type = "enum"
required = false
docs_source = "man:sshd_config(5)#PasswordAuthentication"
help = "Specifies whether password authentication is allowed."
options = [
  { value = "no", label = "Password authentication disabled (keys only)", risk = "recommended" },
  { value = "yes", label = "Password authentication enabled", risk = "caution" },
]

[[fields]]
name = "PubkeyAuthentication"
type = "enum"
required = false
docs_source = "man:sshd_config(5)#PubkeyAuthentication"
help = "Specifies whether public key authentication is allowed."
options = [
  { value = "yes", label = "Public key authentication enabled", risk = "recommended" },
  { value = "no", label = "Public key authentication disabled", risk = "caution" },
]

[[fields]]
name = "KbdInteractiveAuthentication"
type = "enum"
required = false
help = "Specifies whether keyboard-interactive authentication is allowed."
options = [
  { value = "no", label = "Keyboard-interactive authentication disabled", risk = "recommended" },
  { value = "yes", label = "Keyboard-interactive authentication enabled", risk = "caution" },
]

[[fields]]
name = "X11Forwarding"
type = "enum"
required = false
docs_source = "man:sshd_config(5)#X11Forwarding"
help = "Specifies whether X11 forwarding is permitted."
options = [
  { value = "no", label = "X11 forwarding disabled", risk = "recommended" },
  { value = "yes", label = "X11 forwarding enabled", risk = "caution" },
]

[[fields]]
name = "MaxAuthTries"
type = "string"
required = false
help = "Maximum number of authentication attempts permitted per connection."

[[fields]]
name = "AuthorizedKeysFile"
type = "string"
required = false
help = "File containing public keys for user authentication."

[[fields]]
name = "ClientAliveInterval"
type = "string"
required = false
help = "Timeout interval in seconds before sending alive probe."

[[fields]]
name = "ClientAliveCountMax"
type = "string"
required = false
help = "Number of alive probes without response before disconnecting."

[[fields]]
name = "LogLevel"
type = "enum"
required = false
docs_source = "man:sshd_config(5)#LogLevel"
options = [
  { value = "INFO", label = "Standard informational logging", risk = "recommended" },
  { value = "VERBOSE", label = "Verbose logging including fingerprinted keys", risk = "recommended" },
  { value = "DEBUG", label = "Debugging messages", risk = "caution" },
  { value = "QUIET", label = "Silent logging", risk = "caution" },
]

[[fields]]
name = "AllowUsers"
type = "string_list"
required = false
help = "Space-separated list of user names allowed to log in."

[[fields]]
name = "AllowGroups"
type = "string_list"
required = false
help = "Space-separated list of group names allowed to log in."

[[fields]]
name = "DenyUsers"
type = "string_list"
required = false

[[fields]]
name = "DenyGroups"
type = "string_list"
required = false

[[fields]]
name = "Banner"
type = "string"
required = false
help = "Path to file containing message to display before authentication."

[[fields]]
name = "Subsystem"
type = "string"
required = false
help = "Configures external subsystems (e.g. sftp)."

[[validators]]
command = "sshd -t -f {file}"
description = "Validates OpenSSH daemon configuration file syntax."
