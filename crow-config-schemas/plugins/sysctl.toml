[plugin]
name = "sysctl"
grammar = "sysctl-line-grammar"
category = "config.format"

[shape]
kind = "key_value_list"
order_sensitive = true
order_note = "When a key is set twice, the last value wins. Files in /etc/sysctl.d are applied in name order; values only take effect at boot or on `sysctl --system`."

[[fields]]
name = "key"
type = "string"
required = true
help = "A kernel parameter, e.g. net.ipv4.ip_forward. A leading '-' means: ignore it if this kernel doesn't have it."

[[fields]]
name = "value"
type = "string"
required = true
help = "Written to /proc/sys as is. Several numbers are separated by spaces or tabs."

# Checks every key exists on this kernel. A key whose first separator is a
# '/' is a path as is; otherwise dots and slashes swap (sysctl.d(5)). Values can't be checked without
# applying them, so they aren't. Keys with a leading '-' or a glob are skipped.
[[validators]]
command = '''sh -c 'bad=""; while IFS= read -r l || [ -n "$l" ]; do t=$(printf "%s" "$l" | sed "s/^[[:space:]]*//"); case "$t" in "" | \#* | \;* | -*) continue ;; esac; k=$(printf "%s" "${t%%=*}" | sed "s/[[:space:]]*$//"); case "$k" in *\**) continue ;; esac; s=${k%%[./]*}; case "${k#"$s"}" in /*) p="$k" ;; *) p=$(printf "%s" "$k" | tr ./ /.) ;; esac; [ -e "/proc/sys/$p" ] || bad="$bad $k"; done < "$1"; [ -z "$bad" ] || { echo "not a kernel parameter here:$bad" >&2; exit 1; }' crow-sysctl {file}'''
description = "Every key is a parameter this kernel has."
